<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4D96FF">
<title>🚚 Daten umziehen</title>
<style>
  :root { --blue:#4D96FF; --green:#22C55E; --red:#EF4444;
          --text:#232a31; --muted:#7a848c; --line:#e6ebf2; }
  * { box-sizing:border-box; -webkit-text-size-adjust:100%; }
  body { margin:0; padding:22px 16px calc(28px + env(safe-area-inset-bottom));
         font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         color:var(--text); background:#f2f5fa; }
  .wrap { max-width:460px; margin:0 auto; }
  h1 { font-size:1.35em; margin:0 0 6px; text-align:center; }
  .sub { margin:0 0 20px; text-align:center; color:var(--muted); font-size:.92em; }
  .card { background:#fff; border-radius:20px; padding:18px;
          box-shadow:0 6px 20px rgba(0,0,0,.07); margin-bottom:14px; }
  .wer { margin:0 0 14px; font-size:.95em; line-height:1.7; }
  .wer b { font-size:1.05em; }
  .wer .z { display:block; margin-bottom:6px; }
  a.go { display:block; text-decoration:none; text-align:center;
         background:var(--blue); color:#fff; border-radius:16px;
         padding:16px; box-shadow:0 4px 0 rgba(0,0,0,.12); }
  a.go:active { transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.12); }
  a.go b { display:block; font-size:1.12em; }
  a.go span { display:block; font-size:.82em; opacity:.9; margin-top:4px; }
  .schritt { font-size:.9em; color:var(--muted); margin:14px 0 0; line-height:1.6; }
  .schritt b { color:var(--text); }
  details { margin-top:16px; }
  summary { font-size:.9em; color:var(--blue); cursor:pointer; }
  textarea { width:100%; height:120px; margin-top:10px; padding:10px;
             font-family:ui-monospace, Menlo, monospace; font-size:11px; line-height:1.4;
             border:2px solid var(--line); border-radius:12px; word-break:break-all; }
  button.copy { width:100%; margin-top:8px; padding:12px; border:0; border-radius:12px;
                background:var(--green); color:#fff; font-size:1em; font-weight:700; }
  .fehler { color:var(--red); font-weight:600; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🚚 Daten umziehen</h1>
  <p class="sub">Der Fortschritt liegt beim alten Namen der Seite.<br>Von hier nimmst du ihn mit.</p>
  <div class="card" id="karte">Lade…</div>
</div>

<script>
/* Diese Seite liegt bewusst NEBEN der alten App, damit sie denselben
   Speicher sieht (der gilt pro Adresse, nicht pro Datei). Sie ändert
   nichts — sie liest nur und baut daraus einen Link.
   Alles hinter dem "#" bleibt im Handy und wird nie verschickt. */
var ZIEL = 'https://seehund-lernapp.vercel.app/';

function sicher(t) {
  return String(t).replace(/[&<>"]/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
  });
}
var SPIELNAME = { einmaleins:'Einmaleins', zerlegung:'Zahlzerlegung', uhr:'Uhr lesen' };

function zuCode(t) {
  return btoa(unescape(encodeURIComponent(t)))
           .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

var karte = document.getElementById('karte');
var roh = null;
try { roh = localStorage.getItem('lernapp.v2'); } catch (e) {}

var daten = null;
try { daten = roh ? JSON.parse(roh) : null; } catch (e) {}

if (!daten || !daten.profiles || !Object.keys(daten.profiles).length) {
  karte.innerHTML =
    '<p class="fehler">Hier ist kein Fortschritt gespeichert.</p>' +
    '<p class="schritt">Diese Seite muss in <b>demselben Browser</b> geöffnet werden, ' +
    'in dem gespielt wurde — auf dem iPhone also in Safari (oder über das App-Symbol ' +
    'auf dem Startbildschirm, dann oben „…“ → „In Safari öffnen“). ' +
    'Ein privates Fenster hat einen eigenen, leeren Speicher.</p>';
} else {
  var namen = Object.keys(daten.profiles).map(function (id) {
    var p = daten.profiles[id];
    var lvl = [];
    Object.keys(p.games || {}).forEach(function (g) {
      if (p.games[g].level > 0) lvl.push((SPIELNAME[g] || g) + ' Lvl ' + p.games[g].level);
    });
    return '<span class="z">' + (p.avatar || '🙂') + ' <b>' + sicher(p.name) + '</b> — ' +
           (lvl.join(', ') || 'noch kein Level') + '</span>';
  });

  var link = ZIEL + '#daten=' + zuCode(roh);

  karte.innerHTML =
    '<p class="wer">Gefunden:<br>' + namen.join('') + '</p>' +
    '<a class="go" href="' + link.replace(/"/g, '&quot;') + '" rel="noopener">' +
      '<b>Jetzt mitnehmen →</b><span>Öffnet die App unter der neuen Adresse</span></a>' +
    '<p class="schritt">Danach fragt die App nach, ob sie den Fortschritt übernehmen soll — ' +
    '<b>Ja</b> antippen, fertig. Hier bleibt alles unverändert liegen, es geht nichts verloren.</p>' +
    '<details><summary>Klappt der Knopf nicht?</summary>' +
      '<p class="schritt">Diesen Text kopieren, die neue App öffnen, dort auf ' +
      '<b>🚚 Daten umziehen</b> → <b>Oder von Hand kopieren / einfügen</b> tippen und einsetzen.</p>' +
      '<textarea readonly id="feld"></textarea>' +
      '<button class="copy" id="btn">Text kopieren</button>' +
    '</details>';

  document.getElementById('feld').value = link;
  document.getElementById('btn').addEventListener('click', function () {
    var f = document.getElementById('feld');
    f.focus(); f.setSelectionRange(0, f.value.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    if (!ok && navigator.clipboard) {
      navigator.clipboard.writeText(f.value).then(function () {
        document.getElementById('btn').textContent = 'Kopiert ✓';
      });
      return;
    }
    document.getElementById('btn').textContent = ok ? 'Kopiert ✓' : 'Bitte von Hand markieren';
  });
}
</script>
</body>
</html>
