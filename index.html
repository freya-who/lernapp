<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<!-- Damit es auf dem Handy gut aussieht (mitwachsende Breite, kein Mini-Zoom) -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- Farbe der Statusleiste + "Zum Homescreen hinzufügen" schöner machen -->
<meta name="theme-color" content="#4D96FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lern-App">
<title>🎓 Meine Lern-App</title>
<style>
  :root {
    --blue:#4D96FF; --orange:#FF9F43; --purple:#A66CFF;
    --green:#2ecc71; --red:#FF6B6B;
    --text:#2d3436; --muted:#7a848c;
    --card:#ffffff; --shadow:0 6px 20px rgba(0,0,0,.08);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--text);
    background:linear-gradient(160deg,#eef3ff,#fdeeff);
    min-height:100vh;
  }
  .app { max-width:480px; margin:0 auto; padding:22px 16px 40px; }

  /* Ein "Bildschirm" ist sichtbar, wenn er die Klasse .active hat.
     So wechseln wir zwischen Startseite und Spiel — ganz ohne neue Seite. */
  .screen { display:none; }
  .screen.active { display:block; animation:fade .25s ease; }
  @keyframes fade { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  h1 { font-size:1.55em; text-align:center; margin:6px 0 2px; }
  .subtitle { text-align:center; color:var(--muted); font-size:.9em; margin:0 0 18px; }

  /* Der "Beweis", dass lokal gespeichert wird: diese Zahl überlebt das Neuladen */
  .hello {
    background:var(--card); border-radius:16px; box-shadow:var(--shadow);
    padding:16px; text-align:center; margin-bottom:18px;
  }
  .hello .lbl { font-size:.72em; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; }
  .hello .big { font-size:2em; font-weight:800; color:var(--blue); line-height:1.2; }
  .hello input {
    border:2px solid #e3e8f0; border-radius:10px; padding:9px 12px; font-size:1em;
    width:100%; margin-top:10px; text-align:center;
  }
  .hello input:focus { outline:none; border-color:var(--blue); }

  /* Die drei Spiel-Kacheln */
  .card {
    display:flex; align-items:center; gap:14px;
    background:var(--card); border-radius:16px; box-shadow:var(--shadow);
    padding:16px; margin-bottom:14px; cursor:pointer;
    border-left:6px solid var(--blue);
    transition:transform .12s ease;
  }
  .card:active { transform:scale(.98); }
  .card .emoji { font-size:2.1em; width:1.4em; text-align:center; }
  .card .info { flex:1; }
  .card .info h3 { margin:0 0 2px; font-size:1.12em; }
  .card .info p { margin:0; font-size:.82em; color:var(--muted); }
  .card .go { font-size:1.2em; color:var(--muted); }
  .card.soon { opacity:.6; }
  .card.c-blue   { border-left-color:var(--blue); }
  .card.c-orange { border-left-color:var(--orange); }
  .card.c-purple { border-left-color:var(--purple); }

  .btn {
    border:none; border-radius:12px; cursor:pointer;
    font-size:1.05em; font-weight:700; padding:14px 22px; color:#fff;
    background:var(--blue);
  }
  .btn:active { transform:scale(.98); }
  .btn-back {
    background:none; border:none; color:var(--muted); font-weight:600;
    padding:8px 2px; font-size:.95em; cursor:pointer;
  }

  /* Das Mini-Spiel */
  .task { text-align:center; }
  .task .frage { font-size:2.8em; font-weight:800; margin:26px 0 14px; }
  .task input {
    font-size:2em; text-align:center; width:140px; padding:8px;
    border:3px solid #e3e8f0; border-radius:14px;
  }
  .task input:focus { outline:none; border-color:var(--blue); }
  .feedback { font-size:1.3em; font-weight:800; height:34px; margin:16px 0; }
  .feedback.ok { color:var(--green); }
  .feedback.no { color:var(--red); }
  .zaehler { color:var(--muted); font-size:.9em; margin-top:22px; }

  .reset {
    display:block; text-align:center; margin-top:26px;
    color:var(--muted); font-size:.78em; text-decoration:underline; cursor:pointer;
  }
</style>
</head>
<body>
<div class="app">

  <!-- ==================== STARTSEITE ==================== -->
  <div id="home" class="screen active">
    <h1>🎓 Meine Lern-App</h1>
    <p class="subtitle" id="untertitel">Prototyp zum Ausprobieren</p>

    <div class="hello">
      <div class="lbl">Gelöste Aufgaben</div>
      <div class="big" id="total">0</div>
      <input id="name" placeholder="Wie heißt du?" maxlength="20" autocomplete="off">
    </div>

    <!-- Nur diese Kachel funktioniert schon. Die anderen zwei zeigen die Struktur. -->
    <div class="card c-blue" onclick="starteEinmaleins()">
      <div class="emoji">✖️</div>
      <div class="info"><h3>Einmaleins</h3><p>Mal-Aufgaben üben</p></div>
      <div class="go">▶</div>
    </div>

    <div class="card c-orange soon" onclick="baldInfo()">
      <div class="emoji">➕</div>
      <div class="info"><h3>Zahlzerlegung</h3><p>kommt bald 🚧</p></div>
    </div>

    <div class="card c-purple soon" onclick="baldInfo()">
      <div class="emoji">🕐</div>
      <div class="info"><h3>Uhr lesen</h3><p>kommt bald 🚧</p></div>
    </div>

    <span class="reset" onclick="zuruecksetzen()">Fortschritt zurücksetzen</span>
  </div>

  <!-- ==================== EINMALEINS-SPIEL ==================== -->
  <div id="einmaleins" class="screen">
    <button class="btn-back" onclick="zeige('home')">← Zurück</button>
    <div class="task">
      <div class="frage" id="frage">3 × 4</div>
      <div>
        <input id="antwort" inputmode="numeric" pattern="[0-9]*" placeholder="?">
      </div>
      <div class="feedback" id="feedback"></div>
      <button class="btn" onclick="pruefe()">Prüfen</button>
      <div class="zaehler" id="zaehler"></div>
    </div>
  </div>

</div>

<script>
  // ============================================================
  //  1. DATEN LOKAL SPEICHERN  (localStorage — bleibt auf dem Gerät)
  // ============================================================
  // Unter diesem "Schlüssel" liegt alles im Browser-Speicher des Geräts.
  const KEY = 'lernapp.v1';

  // So sieht der Speicher aus, wenn noch nichts da ist:
  function leererStand() {
    return { name: '', geloest: 0 };
  }

  // LESEN: Stand aus dem Gerätespeicher holen
  function load() {
    try {
      return Object.assign(leererStand(), JSON.parse(localStorage.getItem(KEY) || '{}'));
    } catch (e) {
      return leererStand();
    }
  }

  // SCHREIBEN: Stand in den Gerätespeicher zurückschreiben
  function save() {
    localStorage.setItem(KEY, JSON.stringify(stand));
  }

  // Der aktuelle Stand lebt in dieser Variable, gefüllt aus dem Speicher.
  let stand = load();

  // ============================================================
  //  2. BILDSCHIRM-WECHSEL  (Startseite <-> Spiel)
  // ============================================================
  function zeige(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo(0, 0);
    if (id === 'home') aktualisiereHome();
  }

  function aktualisiereHome() {
    document.getElementById('total').textContent = stand.geloest;
    document.getElementById('name').value = stand.name;
    document.getElementById('untertitel').textContent =
      stand.name ? ('Hallo, ' + stand.name + '! 👋') : 'Prototyp zum Ausprobieren';
  }

  // Name sofort speichern, während getippt wird
  document.getElementById('name').addEventListener('input', e => {
    stand.name = e.target.value;
    save();
    document.getElementById('untertitel').textContent =
      stand.name ? ('Hallo, ' + stand.name + '! 👋') : 'Prototyp zum Ausprobieren';
  });

  // ============================================================
  //  3. MINI-SPIEL: EINMALEINS
  // ============================================================
  let a = 0, b = 0; // die aktuelle Aufgabe a × b

  function neueAufgabe() {
    a = 1 + Math.floor(Math.random() * 10); // 1 bis 10
    b = 1 + Math.floor(Math.random() * 10);
    document.getElementById('frage').textContent = a + ' × ' + b;
    document.getElementById('antwort').value = '';
    document.getElementById('feedback').textContent = '';
    document.getElementById('antwort').focus();
    aktualisiereZaehler();
  }

  function starteEinmaleins() {
    zeige('einmaleins');
    neueAufgabe();
  }

  function pruefe() {
    const eingabe = parseInt(document.getElementById('antwort').value, 10);
    const fb = document.getElementById('feedback');
    if (eingabe === a * b) {
      fb.textContent = '✓ Richtig!';
      fb.className = 'feedback ok';
      beep(true);
      stand.geloest++;   // Fortschritt hochzählen ...
      save();            // ... und sofort lokal speichern
      setTimeout(neueAufgabe, 850);
    } else {
      fb.textContent = '✗ Nochmal versuchen';
      fb.className = 'feedback no';
      beep(false);
    }
    aktualisiereZaehler();
  }

  function aktualisiereZaehler() {
    document.getElementById('zaehler').textContent = 'Insgesamt gelöst: ' + stand.geloest;
  }

  // Enter-Taste = Prüfen
  document.getElementById('antwort').addEventListener('keydown', e => {
    if (e.key === 'Enter') pruefe();
  });

  // ============================================================
  //  4. KLEINKRAM
  // ============================================================
  function baldInfo() {
    alert('Dieses Spiel bauen wir als Nächstes! 🚧');
  }

  function zuruecksetzen() {
    if (confirm('Wirklich den ganzen Fortschritt auf diesem Gerät löschen?')) {
      localStorage.removeItem(KEY);
      stand = load();
      aktualisiereHome();
      zeige('home');
    }
  }

  // Kleiner Belohnungs-Ton (aus dem Browser erzeugt, keine Sounddatei nötig)
  let actx = null;
  function beep(ok) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = ok ? 660 : 180;
      o.type = ok ? 'sine' : 'square';
      g.gain.value = 0.08;
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.25);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + 0.25);
    } catch (e) {}
  }

  // Beim Laden: gespeicherten Stand anzeigen (der "Beweis" fürs lokale Speichern)
  aktualisiereHome();
</script>
</body>
</html>
