<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#4D96FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lern-App">
<title>🎓 Meine Lern-App</title>
<!-- ?v=3 = Versionsnummer. Bei Änderungen hochzählen, damit Handys
     nicht die alte zwischengespeicherte Datei anzeigen. -->
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
<div class="app">

  <!-- ============ 1. WER SPIELT? (Profil-Auswahl) ============ -->
  <div id="screen-profiles" class="screen active">
    <h1>🎓 Meine Lern-App</h1>
    <p class="subtitle">Wer spielt?</p>

    <div id="profile-list"></div>

    <div class="new-profile">
      <input id="new-profile-name" placeholder="Neuer Name" maxlength="14" autocomplete="off">
      <button class="btn btn-primary" id="btn-create-profile">Hinzufügen</button>
    </div>
  </div>

  <!-- ============ 2. SPIEL-AUSWAHL ============ -->
  <div id="screen-games" class="screen">
    <div class="who-bar">
      <span class="who" id="who-name"></span>
      <button class="btn-link" id="btn-switch-profile">Spieler wechseln</button>
    </div>
    <p class="subtitle">Was möchtest du üben?</p>
    <div id="game-list"></div>
  </div>

  <!-- ============ 3. EINSTELLUNGEN (pro Spiel) ============ -->
  <div id="screen-settings" class="screen">
    <div class="play-top">
      <button class="btn-back" id="btn-settings-back">← Zurück</button>
    </div>
    <h2 id="settings-title"></h2>
    <div class="panel" id="settings-body"></div>
    <button class="btn btn-primary btn-wide" id="btn-settings-done">Fertig</button>
  </div>

  <!-- ============ 4. SPIELEN ============ -->
  <div id="screen-play" class="screen">
    <div class="play-top">
      <button class="btn-back" id="btn-play-back">← Zurück</button>
      <span class="level-badge" id="level-badge"></span>
    </div>

    <!-- Fortschrittsbalken OBEN: welches Level -->
    <div class="level-bar" id="level-bar"></div>

    <div class="play-main">
      <div class="play-area">
        <div class="task" id="task"></div>
        <div class="feedback" id="feedback"></div>
        <div class="numpad" id="numpad"></div>
      </div>

      <!-- Timer-Balken RECHTS -->
      <div class="timer-col">
        <div class="timer-track"><div class="timer-fill" id="timer-fill"></div></div>
        <div class="timer-label" id="timer-label"></div>
      </div>
    </div>

    <!-- Fortschrittsbalken UNTEN: Frage X von 20 -->
    <div class="q-progress">
      <div class="q-track"><div class="q-fill" id="q-fill"></div></div>
      <div class="q-label" id="q-label"></div>
    </div>
  </div>

  <!-- ============ 5. RUNDEN-ERGEBNIS ============ -->
  <div id="screen-result" class="screen">
    <div class="result-box">
      <div class="result-emoji" id="result-emoji">🎉</div>
      <h2 id="result-title"></h2>
      <div class="result-score" id="result-score"></div>
      <p class="result-msg" id="result-msg"></p>
      <div class="result-level" id="result-level"></div>
      <div class="result-hearts" id="result-hearts"></div>
      <button class="btn btn-primary btn-wide" id="btn-again">Nochmal spielen</button>
      <button class="btn btn-ghost btn-wide" id="btn-to-games">Anderes Spiel</button>
    </div>
  </div>

</div>

<!-- Motor zuerst, dann die Spiele (melden sich selbst an), dann Start -->
<script src="js/engine.js?v=3"></script>
<script src="js/games/einmaleins.js?v=3"></script>
<script src="js/games/zerlegung.js?v=3"></script>
<script src="js/games/uhr.js?v=3"></script>
<script src="js/main.js?v=3"></script>
</body>
</html>
